name: Profile README

on:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * *"
  push:
    paths:
      - "generator/**"
      - "data/live.json"
      - ".github/workflows/profile.yml"
      - "README.md"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator dependencies
        run: python -m pip install -r generator/requirements.txt
      - name: Test generator
        run: python -m unittest discover -s tests -v
      - name: Generate profile
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python -m generator
      - name: Commit changed profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets data/live.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh generated profile"
            git push
          fi
